/* ===== 規則（純函式，全部集中在這裡）===== */
const R={
saveGrammar(data,note){return {data:{...data,grammar:[...data.grammar.filter(x=>x.id!==note.id),note]},msg:''}},
sameName:(items,name,sp)=>items.filter(i=>i.spaceId===sp&&i.status==='pending'&&!i.grammarId&&i.topic.trim()===name.trim()),
linkItems(data,ids,gram){const ls=data.items.filter(i=>ids.includes(i.id)),dids=new Set(ls.map(i=>i.sourceDifficultyId).filter(Boolean));
return {...data,items:data.items.map(i=>ids.includes(i.id)?{...i,grammarId:gram.id,grammarNameSnapshot:gram.name,updatedAt:now()}:i),
sentences:data.sentences.map(x=>x.difficulties.some(d=>dids.has(d.id))?{...x,difficulties:x.difficulties.map(d=>dids.has(d.id)?{...d,grammarId:gram.id,grammarNameSnapshot:gram.name}:d)}:x)}},
// 刪文法：取消 ID 關聯，保留名稱快照
deleteGrammar(data,id){const n=data.grammar.find(g=>g.id===id)?.name||'';
return {...data,grammar:data.grammar.filter(g=>g.id!==id),
sentences:data.sentences.map(s=>({...s,grammarIds:s.grammarIds.filter(x=>x!==id),difficulties:s.difficulties.map(x=>x.grammarId===id?{...x,grammarId:null,grammarNameSnapshot:n}:x)})),
items:data.items.map(i=>i.grammarId===id?{...i,grammarId:null,grammarNameSnapshot:n,topic:i.topic||n}:i)}},
complete:i=>({...i,status:'done',completedAt:now(),updatedAt:now()}),
undo:i=>({...i,status:'pending',completedAt:null,updatedAt:now()}),
postpone:(i,t)=>({...i,dueDate:addDays(i.dueDate>t?i.dueDate:t,1),manualDue:true,updatedAt:now()}),
dueToday:(items,sp,t)=>items.filter(i=>i.spaceId===sp&&i.status==='pending'&&i.dueDate<=t),
tomorrow:(items,sp,t)=>items.filter(i=>i.spaceId===sp&&i.status==='pending'&&i.dueDate===addDays(t,1)),
// 句子的困難 → 待學項目（一困難一項目；已完成不覆蓋；移除的困難只解除關聯）
syncItems(data,s){let items=[...data.items];const ids=new Set(s.difficulties.map(x=>x.id));
items=items.map(i=>i.sourceSentenceId===s.id&&!ids.has(i.sourceDifficultyId)?{...i,sourceSentenceId:null,sourceDifficultyId:null,updatedAt:now()}:i);
s.difficulties.forEach(x=>{const g=x.grammarId&&data.grammar.find(y=>y.id===x.grammarId);const topic=g?g.name:(x.topic||'').trim();if(!topic)return;
const f={kind:g?'review':'learn',topic,grammarId:g?g.id:null,grammarNameSnapshot:g?g.name:''};
const k=items.findIndex(i=>i.sourceSentenceId===s.id&&i.sourceDifficultyId===x.id);
if(k<0)items.push(base({spaceId:s.spaceId,...f,status:'pending',dueDate:addDays(s.studyDate,1),completedAt:null,sourceSentenceId:s.id,sourceDifficultyId:x.id}));

saveSentence(data,s){return R.syncItems({...data,sentences:[...data.sentences.filter(x=>x.id!==s.id),s]},s)},
deleteSentence:(data,id)=>({...data,sentences:data.sentences.filter(s=>s.id!==id),items:data.items.map(i=>i.sourceSentenceId===id?{...i,sourceSentenceId:null,sourceDifficultyId:null,updatedAt:now()}:i)}),
// 移除示範：保留使用者內容；含使用者資料的示範空間轉為一般空間
removeDemo(data){const gone=new Set(data.grammar.filter(g=>g.isDemo).map(g=>g.id));const name={};data.grammar.forEach(g=>name[g.id]=g.name);
const fix=x=>gone.has(x.grammarId)?{...x,grammarId:null,grammarNameSnapshot:name[x.grammarId]}:x;

deleteSpace:(data,id)=>({...data,spaces:data.spaces.filter(s=>s.id!==id),grammar:data.grammar.filter(g=>g.spaceId!==id),sentences:data.sentences.filter(s=>s.spaceId!==id),items:data.items.filter(i=>i.spaceId!==id)})};
let askImpl=null;
const ask=(m,o={})=>new Promise(res=>{if(askImpl)askImpl({m,o,res});else res(o.input!==undefined?null:false)});

${o.choices&&o.choices.map((c,i)=>html`<button key=${i} style="width:100%;margin-bottom:8px" onClick=${()=>done(i)}>${c}</button>`)}

${!o.choices&&html`<button class="pri" onClick=${()=>done(inp?v:true)}>${o.yes||'確定'}</button>`}</div></div></div>`}
const parseBackup=txt=>{let o;try{o=JSON.parse(txt)}catch(e){return {err:'無法讀取，這不是有效的備份內容'}}
const d=o&&o.app==='daily-lingua'?o.data:null;if(!d||!['spaces','grammar','sentences','items'].every(k=>Array.isArray(d[k])))return {err:'這不是 Daily Lingua 的備份'};

if(![d.spaces,d.grammar,d.sentences,d.items].every(a=>a.every(x=>x&&typeof x.id==='string')))return {err:'備份內容格式不正確'};

return {data:m,init:o.init||null}};
const makeBackup=data=>JSON.stringify({app:'daily-lingua',version:1,exportedAt:now(),init:store.init(),data},null,1);
function Backup(){const {data,setData,say,t}=React.useContext(Ctx);const [txt,setTxt]=useState(''),[show,setShow]=useState(false);const ref=React.useRef(null);
const exportFile=async()=>{const text=makeBackup(data);try{if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download='daily-lingua-backup-'+t+'.json';document.body.appendChild(a);a.click();a.remove();say('備份已下載');return}

await dl.save({filename:'daily-lingua-backup-'+t+'.json',data:text});say('備份已儲存')}catch(e){if(e&&e.code==='declined')return;setTxt(text);setShow(true);say('無法直接下載，請複製下方文字自行保存')}};
const restore=async text=>{const r=parseBackup(text);if(r.err)return say(r.err);const d=r.data;

return html`<div class="card"><h3>備份與還原</h3><p class="muted">資料只存在這個瀏覽器。換瀏覽器或換手機前，請先備份，再到新的地方還原。</p>

<input ref=${ref} type="file" accept=".json,application/json" style="display:none" onChange=${async e=>{const f=e.target.files[0];e.target.value='';if(f)restore(await f.text())}}/>

<div class="row"><button onClick=${()=>setTxt(makeBackup(data))}>產生備份文字</button><button class="pri" onClick=${()=>restore(txt)}>還原這段文字</button></div></div>`}</div>`}
/* ===== 雲端同步：純規則（可單獨測試）===== */
const GOOGLE_CLIENT_ID='538113407928-2nr3p8k3dcn2v9sjqogm052lo980nblu.apps.googleusercontent.com';/* 若要讓所有使用者免輸入，可在這裡填入你的用戶端 ID */

const byId=(a,b)=>a.id<b.id?-1:1;
const hasRecords=d=>COLS.some(c=>(d[c]||[]).length>0);
const canon=d=>JSON.stringify([COLS.map(c=>[...(d[c]||[])].sort(byId)),Object.keys(d.tombs||{}).sort().map(k=>[k,d.tombs[k]])]);
// 每次資料變動後：自動更新「最後修改時間」並為刪除的資料留下記號（同步時才不會被另一台裝置復活）
function stamp(prev,next){if(prev===next)return next;const n={...next},tombs={...(prev.tombs||{}),...(next.tombs||{})},t=now();
for(const c of COLS){const pm=new Map((prev[c]||[]).map(x=>[x.id,x])),ids=new Set();

<${GDetail} g=${g}/><div class="row"><button class="sm" onClick=${()=>{setEdit(g.id);go('gform')}}>編輯</button>
<button class="sm danger" onClick=${async()=>{const n=data.sentences.filter(s=>s.grammarIds.includes(g.id)).length+data.items.filter(i=>i.grammarId===g.id).length;
if(await ask('刪除「'+g.name+'」？\n連結它的 '+n+' 筆句子／待學項目會保留，並以文字保留文法名稱。'))up(d=>R.deleteGrammar(d,g.id))}}>刪除</button></div></div>`;
if(!sp)return html`<${Ctx.Provider} value=${{data,up,say,go,sid,sp:{categoryOptions:[]},t,setEdit,edit,setData,gcard,grammars,sync,newSp,clearNewSp:()=>setNewSp(0)}}><main><h1>Daily Lingua</h1><div class="empty">還沒有語言空間。<br/><button class="pri" onClick=${()=>{go('spaces');setNewSp(n=>n+1)}}>建立語言空間</button></div>${page==='spaces'&&html`<${Spaces}/>`}</main><//>`;
const header=html`<div class="row sp"><h1>Daily Lingua</h1>${sync.cfg.enabled&&(sync.needs?html`<button class="sm" onClick=${()=>sync.run(true)}>☁ 同步已暫停，點此重新連線</button>`:html`<span class="muted">☁ ${sync.label}</span>`)}<select style="width:auto" value=${sid} onChange=${e=>setSpace(e.target.value)}>
${data.spaces.map(s=>html`<option value=${s.id}>${s.targetLanguage} ▾</option>`)}</select></div>`;
const scard=s=>html`<div class="card kind-s" key=${s.id}><div class="row sp"><span class="row"><span class="tag">💬 一句話</span><b>${s.originalSentence}</b></span><span class="row">${(!s.firstAttempt||!s.naturalExpression)&&html`<span class="tag">未完成</span>`}${s.isDemo&&html`<span class="tag">示範</span>`}</span></div>
${s.firstAttempt&&html`<div class="row muted"><span>第一次：<span lang="ja">${s.firstAttempt}</span></span><${Spk} text=${s.firstAttempt}/></div>`}
${s.naturalExpression&&html`<div class="row"><span lang="ja">自然說法：${s.naturalExpression}</span><${Spk} text=${s.naturalExpression}/></div>`}
${[['pinyin','拼音錯誤'],['fix','語句修正'],['other','其他筆記']].map(([k,l])=>s.corrections&&s.corrections[k]&&html`<div class="muted" key=${k}>${l}：${s.corrections[k]}</div>`)}
<${DiffToggle} s=${s}/>
<div class="row"><button class="sm" onClick=${()=>{setSedit(s.id);go('sform')}}>編輯</button>
<button class="sm danger" onClick=${async()=>{if(await ask('刪除這句話？由它產生的待學項目會保留，但不再顯示出處。'))up(d=>R.deleteSentence(d,s.id))}}>刪除</button></div></div>`;
const todayG=grammars.filter(g=>g.studyDate===t);
const todayS=data.sentences.filter(s=>s.spaceId===sid&&s.studyDate===t);
let body;
if(page==='home')body=html`${header}
<div class="card"><h3>今日狀態</h3><div>今天已記錄文法：${todayG.length} 句</div><div>今天已記錄生活句子：${todayS.length} 句</div></div>
<div class="row"><button class="pri" onClick=${()=>{setSedit(null);go('sform')}}>記一句話</button><button class="pri" onClick=${()=>{setEdit(null);go('gform')}}>記文法</button></div>
<div class="two"><div><h2>今天要學</h2>${R.dueToday(data.items,sid,t).map(itemRow)}${!R.dueToday(data.items,sid,t).length&&html`<div class="empty">今天沒有待辦，輕鬆一下 ☕</div>`}</div>
<div><h2>明天預定</h2>${R.tomorrow(data.items,sid,t).map(itemRow)}${!R.tomorrow(data.items,sid,t).length&&html`<div class="empty">明天還沒有安排</div>`}</div></div>
<${AddItem}/><${Done}/>`;
else if(page==='today')body=html`${header}<h2>今日學習 <span class="date">${t}</span></h2>${todayG.map(gcard)}
${!todayG.length&&html`<div class="empty">今天還沒有文法筆記，也可以只記生活句子。</div>`}
<h2>生活句子</h2>${todayS.map(scard)}${!todayS.length&&html`<div class="empty">今天還沒有生活句子</div>`}<p><button class="pri" onClick=${()=>{setSedit(null);go('sform')}}>＋ 記一句話</button></p>`;
else if(page==='diary')body=html`${header}<${Diary}/>`;
else if(page==='grammar')body=html`${header}<${Lib}/>`;
else if(page==='gform')body=html`<${GForm} key=${edit||'new'}/>`;
else if(page==='sform')body=html`<${SForm} key=${sedit||'new'}/>`;
else body=html`${header}<${Spaces}/>`;




return html`<${Ctx.Provider} value=${{data,up,say,go,sid,sp,t,setEdit,edit,sedit,setSedit,setData,gcard,grammars,scard,itemRow,sync,newSp,clearNewSp:()=>setNewSp(0),linkId,setLinkId,prefill,setPrefill}}><main>${body}</main>
${isForm?null:html`<nav>${nav.map(p=>p==='+'?html`<button key=${p} onClick=${()=>setMenu(true)}>＋ 新增</button>`:html`<button key=${p} class=${page===p?'on':''} onClick=${()=>go(p)}>${T[p]}</button>`)}
<button class=${page==='spaces'?'on':''} onClick=${()=>go('spaces')} style="display:${window.innerWidth>=768?'block':'none'}">語言空間</button></nav>`}
${menu&&html`<div class="sheet" onClick=${()=>setMenu(false)}><div><h3>想記什麼？</h3><div class="row"><button class="pri" onClick=${()=>{setSedit(null);go('sform')}}>記一句話</button>
<button class="pri" onClick=${()=>{setEdit(null);go('gform')}}>記文法</button></div></div></div>`}
${page!=='spaces'&&!isForm&&html`<main style="padding-top:0"><button onClick=${()=>go('spaces')}>語言空間與資料管理</button></main>`}
<${LinkSheet}/>${toast&&html`<div class="toast">${toast}</div>`}<//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${React.Fragment}><${App}/><${DlgHost}/><//>`);
</script></body></html>
